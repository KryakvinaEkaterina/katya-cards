{% extends "base.html" %}
{% block content %}
<div class="form-card" style="max-width:360px;margin:40px auto;">
    <h2>Вход</h2>
    <form method="post">
        <div class="form-group">
            <label>Логин</label>
            <input type="text" name="username" required autofocus>
        </div>
        <div class="form-group">
            <label>Пароль</label>
            <input type="password" name="password" required>
        </div>
        <button type="submit" class="btn">Войти</button>
    </form>
</div>
{% endblock %}
